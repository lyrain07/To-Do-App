<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>To Do List</title>
        <link rel="icon" type="image/png" href="checklist.png">
        <link rel="stylesheet" href="style.css">
        <script src="todo.js"></script>
        <script src="https://kit.fontawesome.com/5d88ebcb2e.js" crossorigin="anonymous"></script>
    </head>
    
    <body>
        <div class="container">
            <div class="app-wrapper">
                 
                <div class="dashboard">
                    <h2>DASHBOARD</h2>
                    <div class="stats">
                        <div class="stat-item">
                            <span class="stat-label">Tasks:</span>
                            <span class="stat-value" id="total-tasks">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Completed:</span>
                            <span class="stat-value" id="completed-tasks">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Remaining:</span>
                            <span class="stat-value" id="remaining-tasks">0</span>
                        </div>
                    </div>
                    
                    <div class="progress-container">
                        <div class="progress-bar" id="progress-bar"></div>
                    </div>
                </div>

                 
                <div class="todo-app">
                     
                    <div class="cheer-quote" id="cheer-quote">
                        <i class="fa-solid fa-trophy"></i>
                        <p>Amazing! You've completed all your tasks!</p>
                    </div>

                    <h1>TO DO LIST <img src="assests/todo.png"></h1>
                    <form action="">
                        <input type="text" placeholder="New task" id="task">
                        <button type="submit" id="Submit"><i class="fa-solid fa-plus"></i></button>
                    </form>
                    
                    <div class="task-list" id="task-list">
                        <ul id="tasks"></ul>
                    </div>

                     
                    <div class="action-buttons">
                        <button type="button" class="action-btn mark-done-btn" id="mark-done-btn">
                            <i class="fa-solid fa-check"></i> Mark as done
                        </button>
                        <button type="button" class="action-btn delete-all-btn" id="delete-all-btn">
                            <i class="fa-solid fa-trash"></i> Delete all
                        </button>
                    </div>
                </div>
            </div>   
        </div>
    </body>
</html>
